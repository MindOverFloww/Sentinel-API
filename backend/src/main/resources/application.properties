
spring.application.name=api-sentinel

server.port=${SERVER_PORT:8080}

# Database configuration: defaults to in-memory PostgreSQL-mode H2 when DB_URL is not set
spring.datasource.url=${DB_URL:jdbc:h2:mem:api_sentinel;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT configuration
# Set a strong, Base64-encoded secret through the environment
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
